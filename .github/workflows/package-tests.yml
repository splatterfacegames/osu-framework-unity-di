name: Package Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  playmode:
    name: Unity PlayMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Create validation project
        shell: bash
        run: |
          mkdir -p ValidationProject/Assets/Plugins ValidationProject/Packages ValidationProject/ProjectSettings
          cat > ValidationProject/Packages/manifest.json <<'JSON'
          {
            "dependencies": {
              "com.cysharp.r3": "https://github.com/Cysharp/R3.git?path=src/R3.Unity/Assets/R3.Unity",
              "com.osuframework.unity": "file:../UnityPackage",
              "com.unity.test-framework": "1.6.0"
            },
            "testables": [
              "com.osuframework.unity"
            ]
          }
          JSON
          cat > ValidationProject/ProjectSettings/ProjectVersion.txt <<'EOF'
          m_EditorVersion: 6000.4.6f1
          m_EditorVersionWithRevision: 6000.4.6f1 (0b051c2e5d54)
          EOF

      - name: Restore R3 NuGet assemblies
        shell: bash
        run: |
          dotnet new classlib -n DependencyRestore -o .tmp/DependencyRestore
          dotnet add .tmp/DependencyRestore package R3 --version 1.3.0
          dotnet restore .tmp/DependencyRestore
          cp "$(find "$HOME/.nuget/packages/r3" -path '*/lib/netstandard2.1/R3.dll' | head -n 1)" ValidationProject/Assets/Plugins/
          cp "$(find "$HOME/.nuget/packages/microsoft.bcl.timeprovider" -path '*/lib/netstandard2.0/Microsoft.Bcl.TimeProvider.dll' | head -n 1)" ValidationProject/Assets/Plugins/
          cp "$(find "$HOME/.nuget/packages/microsoft.bcl.asyncinterfaces" -path '*/lib/netstandard2.0/Microsoft.Bcl.AsyncInterfaces.dll' | head -n 1)" ValidationProject/Assets/Plugins/
          cp "$(find "$HOME/.nuget/packages/system.threading.channels" -path '*/lib/netstandard2.0/System.Threading.Channels.dll' | head -n 1)" ValidationProject/Assets/Plugins/

      - name: Run package tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ValidationProject
          unityVersion: 6000.4.6f1
          testMode: PlayMode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: test-results
